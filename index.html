<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P301 :: LEAGUE TABLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG — edit this block to point the page at a different league
     ============================================================ */
  :root {
    --bg: #05060a;
    --bg-scan: rgba(0,0,0,0.15);
    --green: #39ff6a;
    --cyan: #00e5ff;
    --yellow: #ffd400;
    --magenta: #ff3b8d;
    --red: #ff3b5c;
    --white: #f2f2f0;
    --dim: #6c7a75;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--white);
    font-family: 'VT323', monospace;
    font-size: 20px;
    min-height: 100vh;
  }

  body {
    background-image:
      repeating-linear-gradient(0deg, var(--bg-scan) 0px, transparent 1px, transparent 2px);
    padding-bottom: 70px; /* room for the ticker */
  }

  .display {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }

  /* ---------- header / page furniture ---------- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 3px solid var(--white);
    padding: 10px 14px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .masthead .page-num {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--yellow);
    letter-spacing: 1px;
  }
  .masthead .title {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--cyan);
    letter-spacing: 1px;
    text-align: center;
    flex: 1;
  }
  .masthead .clock {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--green);
  }

  .subhead {
    text-align: center;
    color: var(--dim);
    font-size: 16px;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  /* ---------- nav tabs (P301 / P302 / P303) ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1;
    min-width: 120px;
    background: transparent;
    border: 2px solid var(--dim);
    color: var(--white);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 10px 6px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .tab.active {
    border-color: var(--yellow);
    color: var(--yellow);
    box-shadow: 0 0 8px rgba(255,212,0,0.4) inset;
  }
  .tab:hover { border-color: var(--cyan); color: var(--cyan); }

  .page { display: none; }
  .page.active { display: block; }

  /* ---------- table ---------- */
  table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
  th, td { padding: 6px 8px; text-align: left; font-size: 19px; }
  thead th {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--cyan);
    border-bottom: 2px solid var(--cyan);
    padding-bottom: 10px;
  }
  tbody tr { border-bottom: 1px dashed rgba(255,255,255,0.15); }
  tbody tr:hover { background: rgba(255,255,255,0.04); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank-cell { display: flex; align-items: center; gap: 6px; }
  .mover-up { color: var(--green); }
  .mover-down { color: var(--red); }
  .mover-flat { color: var(--dim); }
  .team-name { color: var(--white); }
  .manager-name { color: var(--dim); font-size: 15px; display: block; }
  .chip-tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    background: var(--magenta);
    color: #05060a;
    padding: 2px 5px;
    margin-left: 6px;
  }
  .lead-crown { color: var(--yellow); }

  /* ---------- stat cards (P302 / P303) ---------- */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
  .card {
    border: 2px solid var(--dim);
    padding: 12px 14px;
  }
  .card h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 10.5px;
    margin: 0 0 8px;
    color: var(--yellow);
    letter-spacing: 0.5px;
  }
  .card .big {
    font-size: 30px;
    color: var(--green);
    line-height: 1.1;
  }
  .card .who { color: var(--white); font-size: 18px; }
  .card .sub { color: var(--dim); font-size: 15px; }
  .card.warn .big { color: var(--red); }
  .card.cool .big { color: var(--cyan); }
  .card.gold .big { color: var(--yellow); }

  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); font-size: 18px; }

  .status-line {
    text-align: center;
    color: var(--dim);
    font-size: 15px;
    margin-top: 6px;
  }
  .status-line button {
    background: none;
    border: 1px solid var(--dim);
    color: var(--cyan);
    font-family: 'VT323', monospace;
    font-size: 15px;
    padding: 2px 10px;
    cursor: pointer;
    margin-left: 8px;
  }
  .loading-msg { text-align: center; color: var(--yellow); padding: 30px 0; }
  .error-box {
    border: 2px solid var(--red);
    color: var(--red);
    padding: 14px;
    text-align: center;
    margin-bottom: 14px;
  }

  /* ---------- vidiprinter ticker ---------- */
  .ticker-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #000;
    border-top: 3px double var(--green);
    height: 46px;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .ticker-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #000;
    background: var(--green);
    padding: 6px 8px;
    height: 100%;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    z-index: 2;
  }
  .ticker-track {
    display: flex;
    white-space: nowrap;
    animation: scroll-left 45s linear infinite;
  }
  .ticker-track span {
    color: var(--green);
    font-size: 22px;
    padding-right: 60px;
    text-shadow: 0 0 6px rgba(57,255,106,0.6);
  }
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; }
  }
</style>
</head>
<body>

<div class="display">
  <div class="masthead">
    <div class="page-num" id="page-num">P301</div>
    <div class="title" id="page-title">LEAGUE TABLE</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="subhead" id="league-name">LOADING LEAGUE&hellip;</div>

  <div class="tabs">
    <button class="tab active" data-page="standings" data-num="P301" data-title="LEAGUE TABLE">P301 TABLE</button>
    <button class="tab" data-page="gameweek" data-num="P302" data-title="THIS GAMEWEEK">P302 GAMEWEEK</button>
    <button class="tab" data-page="shame" data-num="P303" data-title="HALL OF SHAME">P303 HALL OF SHAME</button>
  </div>

  <div id="error-slot"></div>

  <!-- P301 -->
  <div class="page active" id="page-standings">
    <div id="standings-slot" class="loading-msg">FETCHING STANDINGS&hellip;</div>
  </div>

  <!-- P302 -->
  <div class="page" id="page-gameweek">
    <div id="gameweek-slot" class="loading-msg">CRUNCHING THIS GAMEWEEK&hellip;</div>
  </div>

  <!-- P303 -->
  <div class="page" id="page-shame">
    <div id="shame-slot" class="loading-msg">DIGGING THROUGH THE ARCHIVES&hellip;</div>
  </div>

  <div class="status-line">
    LAST SYNCED: <span id="last-synced">never</span>
    <button id="refresh-btn">REFRESH NOW</button>
  </div>
</div>

<div class="ticker-wrap">
  <div class="ticker-label">VIDIPRINTER</div>
  <div class="ticker-track" id="ticker-track">
    <span>LOADING THE LATEST GOSSIP...</span>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const LEAGUE_ID = 840577;

// Free CORS proxy — FPL's API blocks direct browser requests, so every
// call is routed through this. If it ever goes down, swap PROXY_BASE
// for another proxy (or your own tiny Cloudflare Worker) — nothing
// else in this file needs to change.
const PROXY_BASE = 'https://api.allorigins.win/raw?url=';
const API = 'https://fantasy.premierleague.com/api';
const REFRESH_MS = 60000; // how often to auto-refresh

/* ============================================================
   FETCH HELPERS
   ============================================================ */
function proxied(url) {
  return PROXY_BASE + encodeURIComponent(url);
}

async function fetchJSON(url) {
  const res = await fetch(proxied(url), { cache: 'no-store' });
  if (!res.ok) throw new Error('Request failed: ' + url);
  return res.json();
}

/* ============================================================
   STATE
   ============================================================ */
let elementsMap = {};   // player id -> player object (with event_points)
let currentGW = null;
let leagueName = '';

/* ============================================================
   LOADERS
   ============================================================ */
async function loadBootstrap() {
  const data = await fetchJSON(`${API}/bootstrap-static/`);
  elementsMap = {};
  data.elements.forEach(el => { elementsMap[el.id] = el; });

  const events = data.events;
  let cur = events.find(e => e.is_current);
  if (!cur) cur = [...events].reverse().find(e => e.finished) || events[0];
  currentGW = cur.id;
}

async function loadStandings() {
  const data = await fetchJSON(`${API}/leagues-classic/${LEAGUE_ID}/standings/`);
  leagueName = data.league.name;
  return data.standings.results;
}

async function loadPicks(entryId) {
  return fetchJSON(`${API}/entry/${entryId}/event/${currentGW}/picks/`);
}

async function loadHistory(entryId) {
  return fetchJSON(`${API}/entry/${entryId}/history/`);
}

// simple concurrency-limited map so we don't fire 20 requests at once
// through a free proxy and get throttled
async function mapLimited(items, limit, fn) {
  const results = new Array(items.length);
  let i = 0;
  async function worker() {
    while (i < items.length) {
      const idx = i++;
      results[idx] = await fn(items[idx], idx);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

/* ============================================================
   RENDER: P301 STANDINGS
   ============================================================ */
function playerName(id) {
  const p = elementsMap[id];
  return p ? p.web_name : '???';
}
function playerPts(id) {
  const p = elementsMap[id];
  return p ? p.event_points : 0;
}

function renderStandings(standings) {
  const rows = standings.map(row => {
    const delta = row.last_rank - row.rank; // positive = climbed
    let arrow = '&#9679;', moverClass = 'mover-flat';
    if (delta > 0) { arrow = '&#9650; ' + delta; moverClass = 'mover-up'; }
    else if (delta < 0) { arrow = '&#9660; ' + Math.abs(delta); moverClass = 'mover-down'; }
    const crown = row.rank === 1 ? '<span class="lead-crown">&#9819; </span>' : '';
    return `
      <tr>
        <td class="num">${crown}${row.rank}</td>
        <td class="rank-cell ${moverClass}">${arrow}</td>
        <td>
          <span class="team-name">${escapeHtml(row.entry_name)}</span>
          <span class="manager-name">${escapeHtml(row.player_name)}</span>
        </td>
        <td class="num">${row.event_total}</td>
        <td class="num">${row.total}</td>
      </tr>`;
  }).join('');

  document.getElementById('standings-slot').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>RK</th><th>MOVE</th><th>TEAM</th><th class="num">GW</th><th class="num">TOTAL</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

/* ============================================================
   RENDER: P302 THIS GAMEWEEK
   ============================================================ */
function renderGameweek(managerData) {
  // managerData: [{ name, team, entryId, picks, entryHistory, activeChip }]

  // captains
  const captains = managerData.map(m => {
    const capPick = m.picks.find(p => p.is_captain);
    return {
      manager: m.team,
      player: capPick ? playerName(capPick.element) : '???',
      pts: capPick ? playerPts(capPick.element) : 0
    };
  });
  const worstCap = captains.reduce((a, b) => (b.pts < a.pts ? b : a), captains[0] || {pts:0});
  const bestCap = captains.reduce((a, b) => (b.pts > a.pts ? b : a), captains[0] || {pts:0});

  // benched hero: single highest-scoring benched player, league-wide
  let benchHero = { manager: '-', player: '-', pts: -1 };
  managerData.forEach(m => {
    m.picks.filter(p => p.multiplier === 0).forEach(p => {
      const pts = playerPts(p.element);
      if (pts > benchHero.pts) benchHero = { manager: m.team, player: playerName(p.element), pts };
    });
  });

  // hits taken
  const hitters = managerData
    .filter(m => m.entryHistory.event_transfers_cost > 0)
    .sort((a, b) => b.entryHistory.event_transfers_cost - a.entryHistory.event_transfers_cost);

  // total bench points wasted, per manager
  const benchWaste = [...managerData]
    .sort((a, b) => b.entryHistory.points_on_bench - a.entryHistory.points_on_bench)
    .slice(0, 5);

  document.getElementById('gameweek-slot').innerHTML = `
    <div class="cards">
      <div class="card warn">
        <h3>CAPTAIN'S CURSE</h3>
        <div class="big">${worstCap.pts} pts</div>
        <div class="who">${escapeHtml(worstCap.manager)}</div>
        <div class="sub">armbanded ${escapeHtml(worstCap.player)}. brave.</div>
      </div>
      <div class="card gold">
        <h3>CAPTAIN FANTASTIC</h3>
        <div class="big">${bestCap.pts} pts</div>
        <div class="who">${escapeHtml(bestCap.manager)}</div>
        <div class="sub">${escapeHtml(bestCap.player)} delivered</div>
      </div>
      <div class="card cool">
        <h3>BENCHED HERO</h3>
        <div class="big">${benchHero.pts < 0 ? 0 : benchHero.pts} pts</div>
        <div class="who">${escapeHtml(benchHero.player)}</div>
        <div class="sub">left out by ${escapeHtml(benchHero.manager)}</div>
      </div>
      <div class="card">
        <h3>PALMS GREASED?</h3>
        ${hitters.length === 0
          ? `<div class="sub">nobody took a hit this week. cowards.</div>`
          : `<ul class="plain">${hitters.map(m =>
              `<li>${escapeHtml(m.team)} &mdash; <span style="color:var(--red)">-${m.entryHistory.event_transfers_cost}</span></li>`
            ).join('')}</ul>`}
      </div>
    </div>
    <div class="card">
      <h3>DEADWOOD ON THE BENCH</h3>
      <ul class="plain">
        ${benchWaste.map(m =>
          `<li>${escapeHtml(m.team)} &mdash; <span style="color:var(--yellow)">${m.entryHistory.points_on_bench} pts</span> unused</li>`
        ).join('')}
      </ul>
    </div>
  `;
}

/* ============================================================
   RENDER: P303 HALL OF SHAME (season so far)
   ============================================================ */
function renderShame(managerData) {
  const seasonRows = managerData.map(m => {
    const history = m.history.current || [];
    const totalBench = history.reduce((s, gw) => s + gw.points_on_bench, 0);
    const totalHits = history.reduce((s, gw) => s + gw.event_transfers_cost, 0);
    let best = { points: -1, event: 0 }, worst = { points: 9999, event: 0 };
    history.forEach(gw => {
      if (gw.points > best.points) best = gw;
      if (gw.points < worst.points) worst = gw;
    });
    return { team: m.team, totalBench, totalHits, best, worst };
  });

  const byBench = [...seasonRows].sort((a, b) => b.totalBench - a.totalBench).slice(0, 5);
  const byHits = [...seasonRows].sort((a, b) => b.totalHits - a.totalHits).slice(0, 5);
  const bestGwOverall = [...seasonRows].sort((a, b) => b.best.points - a.best.points)[0];
  const worstGwOverall = [...seasonRows].sort((a, b) => a.worst.points - b.worst.points)[0];

  document.getElementById('shame-slot').innerHTML = `
    <div class="cards">
      <div class="card gold">
        <h3>BEST GW OF THE SEASON</h3>
        <div class="big">${bestGwOverall ? bestGwOverall.best.points : '-'} pts</div>
        <div class="who">${bestGwOverall ? escapeHtml(bestGwOverall.team) : '-'}</div>
        <div class="sub">${bestGwOverall ? 'gameweek ' + bestGwOverall.best.event : ''}</div>
      </div>
      <div class="card warn">
        <h3>WORST GW OF THE SEASON</h3>
        <div class="big">${worstGwOverall ? worstGwOverall.worst.points : '-'} pts</div>
        <div class="who">${worstGwOverall ? escapeHtml(worstGwOverall.team) : '-'}</div>
        <div class="sub">${worstGwOverall ? 'gameweek ' + worstGwOverall.worst.event : ''}</div>
      </div>
    </div>
    <div class="cards">
      <div class="card">
        <h3>MOST POINTS BENCHED (SEASON)</h3>
        <ul class="plain">${byBench.map(r =>
          `<li>${escapeHtml(r.team)} &mdash; <span style="color:var(--yellow)">${r.totalBench}</span></li>`
        ).join('')}</ul>
      </div>
      <div class="card">
        <h3>MOST HITS TAKEN (SEASON)</h3>
        <ul class="plain">${byHits.map(r =>
          `<li>${escapeHtml(r.team)} &mdash; <span style="color:var(--red)">-${r.totalHits}</span></li>`
        ).join('')}</ul>
      </div>
    </div>
  `;
}

/* ============================================================
   VIDIPRINTER TICKER
   ============================================================ */
function buildTicker(standings, managerData) {
  const lines = [];

  standings.forEach(row => {
    const delta = row.last_rank - row.rank;
    if (delta > 0) lines.push(`${row.entry_name.toUpperCase()} CLIMB ${delta} TO ${row.rank}${ordinal(row.rank)}...`);
    if (delta < 0) lines.push(`${row.entry_name.toUpperCase()} SLIP TO ${row.rank}${ordinal(row.rank)}...`);
  });

  managerData.forEach(m => {
    if (m.entryHistory.event_transfers_cost > 0) {
      lines.push(`${m.team.toUpperCase()} TAKE A ${m.entryHistory.event_transfers_cost}-POINT HIT...`);
    }
    const cap = m.picks.find(p => p.is_captain);
    if (cap) {
      const pts = playerPts(cap.element);
      if (pts === 0) lines.push(`${m.team.toUpperCase()}'S CAPTAIN BLANKS...`);
      if (pts >= 10) lines.push(`${m.team.toUpperCase()}'S ARMBAND HAULS ${pts}...`);
    }
  });

  if (lines.length === 0) lines.push('ALL QUIET ON THE WESTERN FRONT...', 'CHECK BACK WHEN THE GAMES KICK OFF...');

  const track = document.getElementById('ticker-track');
  const html = lines.map(l => `<span>${escapeHtml(l)}</span>`).join('');
  track.innerHTML = html + html; // duplicate for seamless loop
}

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[s]));
}
function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return s[(v - 20) % 10] || s[v] || s[0];
}
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });
}

/* ============================================================
   MAIN REFRESH
   ============================================================ */
let refreshing = false;

async function refreshAll() {
  if (refreshing) return;
  refreshing = true;
  document.getElementById('error-slot').innerHTML = '';
  try {
    await loadBootstrap();
    const standings = await loadStandings();
    document.getElementById('league-name').textContent = leagueName + ' — GAMEWEEK ' + currentGW;

    renderStandings(standings);

    // fetch picks + history for every manager, a few at a time
    const managerData = await mapLimited(standings, 4, async (row) => {
      const [picks, history] = await Promise.all([
        loadPicks(row.entry),
        loadHistory(row.entry)
      ]);
      return {
        entryId: row.entry,
        team: row.entry_name,
        picks: picks.picks,
        entryHistory: picks.entry_history,
        activeChip: picks.active_chip,
        history
      };
    });

    renderGameweek(managerData);
    renderShame(managerData);
    buildTicker(standings, managerData);

    document.getElementById('last-synced').textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });
  } catch (err) {
    console.error(err);
    document.getElementById('error-slot').innerHTML = `
      <div class="error-box">
        SIGNAL LOST... COULDN'T REACH THE FPL SERVERS (OR THE FREE PROXY IS HAVING A MOMENT).<br>
        RETRYING AUTOMATICALLY — HIT REFRESH TO TRY NOW.
      </div>`;
  } finally {
    refreshing = false;
  }
}

/* ============================================================
   NAV / INIT
   ============================================================ */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
    document.getElementById('page-num').textContent = tab.dataset.num;
    document.getElementById('page-title').textContent = tab.dataset.title;
  });
});

document.getElementById('refresh-btn').addEventListener('click', refreshAll);

updateClock();
setInterval(updateClock, 1000);
refreshAll();
setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
